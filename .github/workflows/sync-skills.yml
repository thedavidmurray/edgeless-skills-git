name: Sync Skills

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Sync skills
        run: |
          python scripts/skills/skill_sync.py --commit --message "scheduled sync"
        env:
          GIT_AUTHOR_NAME: Edgeless Swarm
          GIT_AUTHOR_EMAIL: edgeless@localhost

      - name: Push changes
        if: github.ref == 'refs/heads/main'
        run: git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
